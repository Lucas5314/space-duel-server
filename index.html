<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Space Duel</title>

<style>
html,body{
  margin:0;
  background:black;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

canvas{
  display:block;
  touch-action:none;
}

#shoot{
  position:fixed;
  bottom:20px;
  right:20px;
  width:90px;
  height:90px;
  border-radius:50%;
  background:red;
  color:white;
  font-size:28px;
  border:none;
  z-index:99999;
}

#status{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  font-family:sans-serif;
  z-index:9999;
  text-align:center;
}

.spinner{
  width:40px;
  height:40px;
  border:4px solid rgba(255,255,255,0.2);
  border-top:4px solid white;
  border-radius:50%;
  margin:12px auto;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  from{
    transform:rotate(0deg);
  }
  to{
    transform:rotate(360deg);
  }
}

#result{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:rgba(0,0,0,0.85);
  color:white;
  font-family:sans-serif;
  font-size:42px;
  z-index:999999;
}

#result button{
  margin-top:20px;
  padding:14px 28px;
  font-size:22px;
  border:none;
  border-radius:12px;
  background:red;
  color:white;
}
</style>
</head>

<body>

<div id="status">
  <div class="spinner"></div>
  Conectando...
</div>

<div id="result">
  <div id="resultText"></div>

  <button onclick="location.reload()">
    Jugar otra vez
  </button>
</div>

<canvas id="c"></canvas>

<button id="shoot">🔥</button>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const shootBtn = document.getElementById("shoot");
const status = document.getElementById("status");
const result = document.getElementById("result");
const resultText = document.getElementById("resultText");

// ================= AUDIO =================
const audioCtx = new (
  window.AudioContext ||
  window.webkitAudioContext
)();

function beep(freq, duration){

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.frequency.value = freq;
  osc.type = "square";

  osc.start();

  gain.gain.setValueAtTime(
    0.1,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    audioCtx.currentTime + duration
  );

  osc.stop(audioCtx.currentTime + duration);
}

// ================= CANVAS =================
function resize(){

  const aspect = 800 / 600;

  let w = innerWidth;
  let h = innerHeight;

  if(w / h > aspect){
    w = h * aspect;
  }else{
    h = w / aspect;
  }

  canvas.style.width = w + "px";
  canvas.style.height = h + "px";

  canvas.width = 800;
  canvas.height = 600;
}

resize();

window.addEventListener("resize", resize);

// ================= WS =================
const ws = new WebSocket(
  "wss://space-duel-server-1.onrender.com"
);

// 🔥 fallback si Render tarda
setTimeout(() => {

  if(ws.readyState !== WebSocket.OPEN){

    status.innerHTML = `
      <div class="spinner"></div>

      Servidor despertando...<br>
      Esto puede tardar unos segundos<br><br>

      <button
        onclick="location.reload()"
        style="
          padding:12px 20px;
          font-size:18px;
          border:none;
          border-radius:10px;
          background:red;
          color:white;
        "
      >
        Reintentar
      </button>
    `;
  }

}, 6000);

let myId = null;

let state = {
  players: [],
  bullets: []
};

const keys = {};

let dots = 0;
let lastHp = 4;

setInterval(() => {

  if(
    status.textContent.includes("Conectando") ||
    status.textContent.includes("Esperando")
  ){

    dots = (dots + 1) % 4;

    const txt =
      ws.readyState === WebSocket.OPEN
      ? "Esperando rival"
      : "Conectando";

    status.innerHTML = `
      <div class="spinner"></div>
      ${txt}${".".repeat(dots)}
    `;
  }

}, 500);

// ================= CONNECTION =================
ws.onopen = () => {

  console.log("WS CONNECTED");

  status.innerHTML = `
    <div class="spinner"></div>
    Esperando rival...
  `;

  ws.send(JSON.stringify({
    type:"play"
  }));
};

// 🔥 ERROR CONNECTION
ws.onerror = err => {

  console.log("WS ERROR", err);

  status.innerHTML = `
    <div class="spinner"></div>

    Error de conexión<br><br>

    <button
      onclick="location.reload()"
      style="
        padding:12px 20px;
        font-size:18px;
        border:none;
        border-radius:10px;
        background:red;
        color:white;
      "
    >
      Reintentar
    </button>
  `;
};

ws.onclose = () => {
  console.log("WS CLOSED");
};

ws.onmessage = e => {

  let msg;

  try{
    msg = JSON.parse(e.data);
  }catch(err){
    console.log("JSON ERROR");
    return;
  }

  console.log("MSG", msg);

  // ===== WELCOME =====
  if(msg.type === "welcome"){
    myId = msg.id;
  }

  // ===== GAME STATE =====
  if(msg.type === "state"){

    state.players = msg.players || [];
    state.bullets = msg.projectiles || [];

    const me = state.players.find(
      p => p.id === myId
    );

    if(me){

      if(me.hp < lastHp){
        beep(120, 0.2);
      }

      lastHp = me.hp;
    }

    status.textContent = "";
  }

  // ===== GAME OVER =====
  if(msg.type === "gameover"){

    result.style.display = "flex";

    if(msg.loser === myId){

      beep(90, 0.6);

      resultText.innerHTML = `
        💀 PERDISTE
      `;

    }else{

      beep(1000, 0.5);

      resultText.innerHTML = `
        🏆 GANASTE
      `;
    }
  }
};

// ================= KEYBOARD =================
window.addEventListener("keydown", e => {

  keys[e.code] = true;

  if(e.code === "Space"){
    shoot();
  }
});

window.addEventListener("keyup", e => {
  keys[e.code] = false;
});

// ================= TOUCH =================
let touch = false;

canvas.addEventListener("pointerdown", e => {

  touch = true;

  handleTouch(e);
});

canvas.addEventListener("pointermove", e => {

  if(touch){
    handleTouch(e);
  }
});

canvas.addEventListener("pointerup", () => {

  touch = false;

  keys["ArrowLeft"] = false;
  keys["ArrowRight"] = false;
});

function handleTouch(e){

  const rect = canvas.getBoundingClientRect();

  const x =
    (e.clientX - rect.left) *
    (800 / rect.width);

  keys["ArrowLeft"] = x < 350;
  keys["ArrowRight"] = x > 450;
}

// ================= SHOOT =================
function shoot(){

  if(ws.readyState !== WebSocket.OPEN){
    return;
  }

  beep(700, 0.08);

  ws.send(JSON.stringify({
    type:"input",
    fire:true
  }));
}

["click","pointerdown","touchstart"].forEach(ev => {

  shootBtn.addEventListener(ev, e => {

    e.preventDefault();

    shoot();

  }, { passive:false });

});

// ================= INPUT LOOP =================
setInterval(() => {

  if(ws.readyState !== WebSocket.OPEN){
    return;
  }

  ws.send(JSON.stringify({

    type:"input",

    left:
      keys["ArrowLeft"] ||
      keys["KeyA"],

    right:
      keys["ArrowRight"] ||
      keys["KeyD"]

  }));

}, 50);

// ================= RENDER =================
function draw(){

  // background
  ctx.fillStyle = "black";
  ctx.fillRect(0,0,800,600);

  // estrellas animadas
  for(let i=0;i<40;i++){

    const x = (i * 97 + Date.now()/20) % 800;
    const y = (i * 53) % 600;

    ctx.fillStyle = "white";
    ctx.fillRect(x,y,2,2);
  }

  // players
  for(const p of state.players){

    ctx.save();

    ctx.translate(p.x, p.y);

    ctx.fillStyle =
      p.id === myId
      ? "cyan"
      : "orange";

    // ship
    ctx.beginPath();
    ctx.moveTo(0,-20);
    ctx.lineTo(15,20);
    ctx.lineTo(-15,20);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    // hp
    ctx.fillStyle = "white";
    ctx.font = "18px sans-serif";

    ctx.fillText(
      p.hp ?? 4,
      p.x - 5,
      p.y - 28
    );
  }

  // bullets
  ctx.fillStyle = "red";

  for(const b of state.bullets){

    ctx.fillRect(
      b.x - 4,
      b.y - 10,
      8,
      20
    );
  }

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
```
