<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Space Tip</title>

<style>
html,body{
  margin:0;
  overflow:hidden;
  background:#050816;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:sans-serif;
}

canvas{
  display:block;
  touch-action:none;
  background:
    radial-gradient(circle at top,#13203f,#050816 70%);
  border:2px solid #2f4f88;
  box-shadow:0 0 30px rgba(0,150,255,0.3);
}

#shoot{
  position:fixed;
  bottom:20px;
  right:20px;
  width:90px;
  height:90px;
  border-radius:50%;
  background:#ff3b3b;
  color:white;
  font-size:30px;
  border:none;
  z-index:99999;
}

#status{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  z-index:9999;
  text-align:center;
  background:rgba(0,0,0,0.45);
  padding:12px 20px;
  border-radius:16px;
  backdrop-filter:blur(6px);
  min-width:260px;
}

#title{
  font-size:28px;
  font-weight:bold;
  color:#7fd3ff;
  margin-bottom:8px;
}

#statusText{
  font-size:18px;
}

.spinner{
  width:42px;
  height:42px;
  border:4px solid rgba(255,255,255,0.2);
  border-top:4px solid #7fd3ff;
  border-radius:50%;
  margin:10px auto;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

#result{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:rgba(0,0,0,0.88);
  color:white;
  font-size:42px;
  z-index:999999;
}

#result button{
  margin-top:20px;
  padding:14px 28px;
  font-size:22px;
  border:none;
  border-radius:12px;
  background:#2d8cff;
  color:white;
}
</style>
</head>

<body>

<div id="status">

  <div id="title">
    🚀 SPACE TIP
  </div>

  <div class="spinner"></div>

  <div id="statusText">
    Conectando...
  </div>

</div>

<div id="result">
  <div id="resultText"></div>
  <button onclick="location.reload()">
    Jugar otra vez
  </button>
</div>

<canvas id="c"></canvas>

<button id="shoot">🔥</button>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const shootBtn = document.getElementById("shoot");

const result = document.getElementById("result");
const resultText = document.getElementById("resultText");

const statusText =
document.getElementById("statusText");

// ================= AUDIO =================
const audioCtx =
new (window.AudioContext ||
window.webkitAudioContext)();

function beep(freq,duration){

  const osc =
  audioCtx.createOscillator();

  const gain =
  audioCtx.createGain();

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.frequency.value = freq;
  osc.type = "square";

  osc.start();

  gain.gain.setValueAtTime(
    0.08,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    audioCtx.currentTime + duration
  );

  osc.stop(audioCtx.currentTime + duration);
}

// ================= CANVAS =================
function resize(){

  const aspect = 800 / 600;

  let w = innerWidth;
  let h = innerHeight;

  if(w / h > aspect){
    w = h * aspect;
  }else{
    h = w / aspect;
  }

  canvas.style.width = w + "px";
  canvas.style.height = h + "px";

  canvas.width = 800;
  canvas.height = 600;
}

resize();

window.addEventListener(
  "resize",
  resize
);

// ================= WS =================
const ws = new WebSocket(
  "wss://space-duel-server-1.onrender.com"
);

let myId = null;

let state = {
  players: [],
  bullets: []
};

const keys = {};

// ================= STATUS =================
let dots = 0;

setInterval(() => {

  if(
    statusText.textContent.includes("Conectando") ||
    statusText.textContent.includes("Buscando")
  ){

    dots = (dots + 1) % 4;

    const txt =
      ws.readyState === WebSocket.OPEN
      ? "Buscando rival o BOT"
      : "Conectando";

    statusText.textContent =
      txt + ".".repeat(dots);
  }

},500);

// ================= WS =================
ws.onopen = () => {

  statusText.textContent =
    "Buscando rival o BOT...";

  ws.send(JSON.stringify({
    type:"play"
  }));
};

ws.onerror = () => {

  statusText.innerHTML = `
    Error de conexión.<br>
    El servidor puede estar iniciando.
  `;
};

ws.onmessage = e => {

  let msg;

  try{
    msg = JSON.parse(e.data);
  }catch{
    return;
  }

  if(msg.type === "welcome"){
    myId = msg.id;
  }

  if(msg.type === "state"){

    state.players =
      msg.players || [];

    state.bullets =
      msg.projectiles || [];

    statusText.textContent =
      "Partida en curso";
  }

  if(msg.type === "gameover"){

    result.style.display = "flex";

    if(String(msg.loser) === String(myId)){

      beep(90,0.6);

      resultText.textContent =
        "💀 PERDISTE";

    }else{

      beep(1000,0.5);

      resultText.textContent =
        "🏆 GANASTE";
    }
  }
};

// ================= INPUT =================
window.addEventListener(
  "keydown",
  e => {

    keys[e.code] = true;

    if(e.code === "Space"){
      shoot();
    }
  }
);

window.addEventListener(
  "keyup",
  e => {
    keys[e.code] = false;
  }
);

// ================= TOUCH =================
let touch = false;

canvas.addEventListener(
  "pointerdown",
  e => {
    touch = true;
    handleTouch(e);
  }
);

canvas.addEventListener(
  "pointermove",
  e => {
    if(touch) handleTouch(e);
  }
);

canvas.addEventListener(
  "pointerup",
  () => {

    touch = false;

    keys["ArrowLeft"] = false;
    keys["ArrowRight"] = false;
  }
);

function handleTouch(e){

  const rect =
    canvas.getBoundingClientRect();

  const x =
    (e.clientX - rect.left) *
    (800 / rect.width);

  keys["ArrowLeft"] = x < 350;
  keys["ArrowRight"] = x > 450;
}

// ================= SHOOT =================
function shoot(){

  if(ws.readyState !== WebSocket.OPEN){
    return;
  }

  beep(700,0.08);

  ws.send(JSON.stringify({
    type:"input",
    fire:true
  }));
}

["click","pointerdown","touchstart"]
.forEach(ev => {

  shootBtn.addEventListener(
    ev,
    e => {

      e.preventDefault();

      shoot();

    },
    { passive:false }
  );

});

// ================= INPUT LOOP =================
setInterval(() => {

  if(ws.readyState !== WebSocket.OPEN){
    return;
  }

  ws.send(JSON.stringify({

    type:"input",

    left:
      keys["ArrowLeft"] ||
      keys["KeyA"],

    right:
      keys["ArrowRight"] ||
      keys["KeyD"]

  }));

},50);

// ================= RENDER =================
function draw(){

  ctx.clearRect(0,0,800,600);

  // estrellas
  for(let i=0;i<70;i++){

    const x =
      (i*97 + Date.now()/18) % 800;

    const y =
      (i*53) % 600;

    ctx.fillStyle =
      "rgba(255,255,255,0.8)";

    ctx.fillRect(x,y,2,2);
  }

  // players
  for(const p of state.players){

    ctx.save();

    ctx.translate(p.x,p.y);

    ctx.fillStyle =
      p.id === myId
      ? "#56c8ff"
      : "#ff9f43";

    ctx.beginPath();

    ctx.moveTo(0,-20);
    ctx.lineTo(15,20);
    ctx.lineTo(-15,20);

    ctx.closePath();
    ctx.fill();

    ctx.restore();

    ctx.fillStyle = "white";

    ctx.font = "18px sans-serif";

    ctx.fillText(
      p.hp ?? 4,
      p.x - 5,
      p.y - 28
    );
  }

  // bullets
  ctx.fillStyle = "#ff4040";

  for(const b of state.bullets){

    ctx.fillRect(
      b.x - 4,
      b.y - 10,
      8,
      20
    );
  }

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
