<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Space Duel</title>

<style>
html,body{
  margin:0;
  background:black;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

canvas{
  display:block;
  touch-action:none;
}

#shoot{
  position:fixed;
  bottom:20px;
  right:20px;
  width:90px;
  height:90px;
  border-radius:50%;
  background:red;
  color:white;
  font-size:28px;
  border:none;
  z-index:99999;
}

#status{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  font-family:sans-serif;
}
</style>
</head>

<body>

<div id="status">Conectando…</div>
<canvas id="c"></canvas>
<button id="shoot">🔥</button>

<script>
console.log("CLIENT OK");

// ================= ADMOB =================
const { AdMob } = window.Capacitor.Plugins;

async function initAds(){
  try{
    await AdMob.initialize();
    console.log("AdMob OK");
  }catch(e){
    console.log("AdMob error", e);
  }
}

initAds();

async function showAd(){
  try{
    await AdMob.prepareInterstitial({
      adId: 'ca-app-pub-3940256099942544/1033173712' // TEST
    });

    await AdMob.showInterstitial();
  }catch(e){
    console.log("Ad error", e);
  }
}

// contador de partidas
let partidas = 0;

// ================= CANVAS =================
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const shootBtn = document.getElementById("shoot");
const status = document.getElementById("status");

function resize(){
  const aspect = 800/600;
  let w = innerWidth;
  let h = innerHeight;

  if(w/h > aspect) w = h * aspect;
  else h = w / aspect;

  canvas.style.width = w+"px";
  canvas.style.height = h+"px";
  canvas.width = 800;
  canvas.height = 600;
}
resize();
addEventListener("resize", resize);

// ================= WS =================
const ws = new WebSocket("wss://space-duel-server-1.onrender.com");

let myId = null;
let ready = false;

let state = { players:{}, bullets:[] };
const keys = {};

// ================= AUDIO =================
const sndShoot = new Audio("audio/disparo.wav");
const sndImpact = new Audio("audio/impacto.wav");

document.addEventListener("pointerdown", ()=>{
  sndShoot.play().then(()=>sndShoot.pause()).catch(()=>{});
}, { once:true });

// ================= WS =================
ws.onopen = ()=>{
  console.log("WS OPEN");
  status.textContent = "Esperando rival…";

  ws.send(JSON.stringify({ type:"play" }));
};

ws.onmessage = async e=>{
  const msg = JSON.parse(e.data);

  if(msg.type === "welcome"){
    myId = msg.id;
    console.log("ID:", myId);
  }

  if(msg.type === "state"){
    state.players = msg.players || {};
    state.bullets = msg.bullets || [];

    ready = true;
    status.textContent = "";
  }

  if(msg.type === "hit"){
    sndImpact.currentTime = 0;
    sndImpact.play().catch(()=>{});
  }

  if(msg.type === "gameover"){
    partidas++;

    alert(msg.winner === myId ? "GANASTE" : "PERDISTE");

    if(partidas % 4 === 0){
      await showAd();
    }

    location.reload();
  }
};

// ================= INPUT =================
window.addEventListener("keydown", e=>{
  keys[e.code] = true;

  if(e.code === "Space") shoot();
});

window.addEventListener("keyup", e=>{
  keys[e.code] = false;
});

// ================= TOUCH =================
let touch = false;

canvas.addEventListener("pointerdown", e=>{
  touch = true;
  handle(e);
});

canvas.addEventListener("pointermove", e=>{
  if(touch) handle(e);
});

canvas.addEventListener("pointerup", ()=>{
  touch = false;
  keys["ArrowLeft"] = false;
  keys["ArrowRight"] = false;
});

function handle(e){
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (800 / rect.width);

  keys["ArrowLeft"] = x < 350;
  keys["ArrowRight"] = x > 450;
}

// ================= SHOOT =================
function shoot(){
  console.log("SHOOT");

  if(ws.readyState !== WebSocket.OPEN){
    console.log("WS CLOSED");
    return;
  }

  ws.send(JSON.stringify({ type:"shoot" }));

  sndShoot.currentTime = 0;
  sndShoot.play().catch(()=>{});
}

["click","pointerdown","touchstart"].forEach(ev=>{
  shootBtn.addEventListener(ev, e=>{
    e.preventDefault();
    shoot();
  }, { passive:false });
});

// ================= LOOP =================
setInterval(()=>{
  if(ws.readyState !== WebSocket.OPEN) return;

  ws.send(JSON.stringify({
    type:"input",
    left: keys["ArrowLeft"] || keys["KeyA"],
    right: keys["ArrowRight"] || keys["KeyD"]
  }));
},50);

// ================= RENDER =================
function draw(){
  ctx.fillStyle="black";
  ctx.fillRect(0,0,800,600);

  for(const p of Object.values(state.players)){
    ctx.save();
    ctx.translate(p.x,p.y);

    ctx.fillStyle = p.id === myId ? "cyan" : "orange";

    ctx.beginPath();
    ctx.moveTo(0,-20);
    ctx.lineTo(15,20);
    ctx.lineTo(-15,20);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    ctx.fillStyle="white";
    ctx.fillText(p.hp ?? 3, p.x-5, p.y-25);
  }

  ctx.fillStyle="red";
  for(const b of state.bullets){
    ctx.fillRect(b.x-4,b.y-10,8,20);
  }

  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
