<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando</title>

    <link rel="stylesheet" href="style/loading.css">
</head>

<body>



<!-- LOGO ARRIBA DERECHA -->
<img
    id="logo"
    src="assets/backgrounds/logotipo.png"
    alt="Logo">


<div class="loader">


    <!-- Texto loading personalizado -->
    <img
        id="loadingText"
        src="assets/ui/loading-text.png"
        alt="Cargando">


    <!-- Número personalizado -->
    <img
        id="percent"
        src="assets/ui/numbers/0.png"
        alt="0%">


    <div class="bar">

        <div id="progress"></div>

    </div>


</div>


<script type="module" src="js/loading.js"></script>

</body>
</html>
