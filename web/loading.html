<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPACE TIP - Cargando</title>

    <link rel="stylesheet" href="style/loading.css">
</head>

<body>

<div id="stars"></div>

<div class="loader">

    <img
        id="logo"
        src="assets/backgrounds/loading.png"
        alt="Logo">


    <!-- Título personalizado PNG -->
    <img 
        class="spaceTitle"
        src="assets/ui/space-tip-title.png"
        alt="SPACE TIP">


    <!-- Texto loading personalizado -->
    <img
        id="loadingText"
        src="assets/ui/loading-text.png"
        alt="Cargando">


    <div class="bar">

        <div id="progress"></div>

    </div>


    <!-- Número personalizado -->
    <img
        id="percent"
        src="assets/ui/numbers/0.png"
        alt="0%">


</div>


<script type="module" src="js/loading.js"></script>

</body>
</html>
