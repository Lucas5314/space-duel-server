<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Laugh Battles - Tienda</title>

    <link
        rel="stylesheet"
        href="style/tienda.css">

</head>

<body>

    <header>

        <button id="backBtn">

            <img
                src="assets/ui/voltar.png"
                alt="Volver">

        </button>

        <img
            class="storeTitle"
            src="assets/ui/tienda.png"
            alt="Tienda">

    </header>


    <main>

        <div class="coinsBalance">

            <img
                src="assets/ui/coins.png"
                alt="Monedas">

            <span id="coinsAmount">0</span>

        </div>


        <section id="packsContainer">


            <!-- 300 MONEDAS -->

            <div class="coinPack">

                <div class="coinIcon">

                    <img
                        src="assets/ui/coins.png"
                        alt="300 monedas">

                </div>

                <h2>300</h2>

                <p>Monedas</p>

                <button
                    class="buyButton"
                    data-product="coins_300">

                    COMPRAR

                </button>

            </div>


            <!-- 600 MONEDAS -->

            <div class="coinPack">

                <div class="coinIcon">

                    <img
                        src="assets/ui/coins.png"
                        alt="600 monedas">

                </div>

                <h2>600</h2>

                <p>Monedas</p>

                <button
                    class="buyButton"
                    data-product="coins_600">

                    COMPRAR

                </button>

            </div>


            <!-- 1200 MONEDAS -->

            <div class="coinPack">

                <div class="coinIcon">

                    <img
                        src="assets/ui/coins.png"
                        alt="1200 monedas">

                </div>

                <h2>1200</h2>

                <p>Monedas</p>

                <button
                    class="buyButton"
                    data-product="coins_1200">

                    COMPRAR

                </button>

            </div>


        </section>

    </main>


    <script
        type="module"
        src="js/tienda.js">
    </script>

</body>

</html>
