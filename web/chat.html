<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Laugh Battles</title>

    <link rel="stylesheet" href="style/chat.css">
</head>

<body>

    <main class="container">

        <div class="chat-layout">

            <!-- AMIGOS: 32 % -->
            <aside class="friends-panel">

                <div id="friendsList" class="friends-list">

                    <button class="friend-item active"
                            data-user="Alex">

                        <div class="friend-info">
                            <strong>Alex</strong>
                            <span class="online">En línea</span>
                        </div>

                    </button>

                    <button class="friend-item"
                            data-user="Lucas">

                        <div class="friend-info">
                            <strong>Lucas</strong>
                            <span class="online">En línea</span>
                        </div>

                    </button>

                    <button class="friend-item"
                            data-user="Shadow">

                        <div class="friend-info">
                            <strong>Shadow</strong>
                            <span class="offline">Desconectado</span>
                        </div>

                    </button>

                    <button class="friend-item"
                            data-user="Nova">

                        <div class="friend-info">
                            <strong>Nova</strong>
                            <span class="online">En línea</span>
                        </div>

                    </button>

                </div>

                <button class="back-btn"
                        onclick="location.href='profile.html'">
                    Volver
                </button>

            </aside>


            <!-- CONVERSACIÓN: 68 % -->
            <section class="chat-box">

                <div class="chat-header">

                    <strong id="chatUser">Alex</strong>

                    <span id="chatStatus" class="online">
                        En línea
                    </span>

                </div>


                <!-- MENSAJES -->
                <div id="messages" class="messages">

                    <div class="message friend">
                        Hola, ¿jugamos una batalla?
                    </div>

                    <div class="message me">
                        Claro.
                    </div>

                </div>


                <!-- ESCRIBIR -->
                <form class="write-area" id="chatForm">

                    <input
                        id="messageInput"
                        type="text"
                        placeholder="Escribe un mensaje..."
                        autocomplete="off"
                    >

                    <button id="sendBtn" type="submit">
                        Enviar
                    </button>

                </form>

            </section>

        </div>

    </main>

    <script src="js/chat.js"></script>

</body>
</html>
