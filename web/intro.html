<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SpaceTip Studios</title>


<style>


html,body{

    margin:0;
    width:100%;
    height:100%;

    overflow:hidden;

    background:black;

}



.intro{

    width:100%;
    height:100%;


    background-image:url("assets/intro/background.png");

    background-size:cover;
    background-position:center;


    display:flex;

    justify-content:center;
    align-items:center;


    transition:opacity 1s ease;

}




/* LOGO HORIZONTAL */


.logo{

    display:flex;

    flex-direction:row;

    justify-content:center;

    align-items:center;


    gap:15px;

}



.logo img{


    width:180px;


    opacity:0;

    filter:blur(20px);


}




/* SPACE ENTRA DESDE IZQUIERDA */


.space{


    animation:showSpace 1.5s ease forwards;


}




/* TIP ENTRA DESDE DERECHA */


.tip{


    animation:showTip 1.5s ease forwards;

    animation-delay:0.4s;


}





@keyframes showSpace{


from{


    opacity:0;

    transform:translateX(-100px) scale(0.7);

    filter:blur(20px);


}


to{


    opacity:1;

    transform:translateX(0) scale(1);

    filter:blur(0);


}


}





@keyframes showTip{


from{


    opacity:0;

    transform:translateX(100px) scale(0.7);

    filter:blur(20px);


}


to{


    opacity:1;

    transform:translateX(0) scale(1);

    filter:blur(0);


}


}







/* SALIDA */


.fadeOut{


    opacity:0;


}





/* MOVIL */


@media(max-width:900px){


.logo img{


    width:120px;


}


.gap{


    gap:8px;

}



}



</style>


</head>




<body>



<div class="intro" id="intro">


    <div class="logo">


        <img 
        class="space" 
        src="assets/intro/yellow.png">


        <img 
        class="tip" 
        src="assets/intro/ruby.png">


    </div>


</div>





<audio id="logoSound">


<source src="assets/audio/yellowruby.ogg" type="audio/ogg">


</audio>





<script>


const sound = document.getElementById("logoSound");

const intro = document.getElementById("intro");



// sonido al aparecer el logo


setTimeout(()=>{


    sound.volume = 0.6;

    sound.play().catch(()=>{});


},700);






// cambiar a loading


setTimeout(()=>{


    intro.classList.add("fadeOut");



    setTimeout(()=>{


        window.location.href="loading.html";


    },1000);



},5000);




</script>



</body>


</html>
