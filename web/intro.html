<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpaceTip Studios</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.intro {
    width: 100%;
    height: 100%;
    background-image: url("assets/intro/background.png");
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column; /* Apila el video arriba y los PNG abajo */
    justify-content: center;
    align-items: center;
    gap: 20px; /* Espacio entre el video y el texto PNG */
    transition: opacity 1s ease;
}

/* 1. VIDEO DEL LOGO ARRIBA */
.logo-video {
    width: 300px; /* Ajusta el tamaño del video del logo */
    max-width: 75vw;
    border-radius: 16px;
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 0.6s ease, transform 0.6s ease;
    /* Si tu video tiene fondo negro y quieres hacerlo transparente sobre background.png, descomenta la siguiente línea: */
    /* mix-blend-mode: screen; */
}

.intro.active .logo-video {
    opacity: 1;
    transform: scale(1);
}

/* 2. TEXTO EN PNG HORIZONTAL ABAJO */
.logo {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

.logo img {
    width: 180px;
    opacity: 0;
    filter: blur(20px);
    will-change: transform, opacity, filter;
}

/* Se disparan cuando el video llega al segundo exacto (o al arrancar el audio) */
.intro.show-text .space {
    animation: showSpace 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.intro.show-text .tip {
    animation: showTip 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: 0.35s;
}

@keyframes showSpace {
    from {
        opacity: 0;
        transform: translateX(-100px) scale(0.7);
        filter: blur(20px);
    }
    to {
        opacity: 1;
        transform: translateX(0) scale(1);
        filter: blur(0);
    }
}

@keyframes showTip {
    from {
        opacity: 0;
        transform: translateX(100px) scale(0.7);
        filter: blur(20px);
    }
    to {
        opacity: 1;
        transform: translateX(0) scale(1);
        filter: blur(0);
    }
}

/* SALIDA */
.fadeOut {
    opacity: 0;
    pointer-events: none;
}

/* MÓVIL */
@media (max-width: 900px) {
    .intro {
        gap: 12px;
    }
    .logo-video {
        width: 210px;
    }
    .logo {
        gap: 8px;
    }
    .logo img {
        width: 120px;
    }
}
</style>
</head>

<body>

<div class="intro" id="intro">

    <!-- VIDEO DEL LOGO ARRIBA -->
    <!-- Cambia "assets/intro/logo.mp4" por el nombre real de tu archivo de video -->
    <video id="logoVideo" class="logo-video" muted playsinline preload="auto">
        <source src="assets/intro/logo.webm" type="video/webm">
    </video>

    <!-- TEXTO PNG ABAJO (YELLOW + RUBY) -->
    <div class="logo">
        <img class="space" src="assets/intro/yellow.png" alt="Space">
        <img class="tip" src="assets/intro/ruby.png" alt="Tip">
    </div>

</div>

<audio id="logoSound" preload="auto">
    <source src="assets/audio/yellowruby.ogg" type="audio/ogg">
</audio>

<script>
const sound = document.getElementById("logoSound");
const intro = document.getElementById("intro");
const video = document.getElementById("logoVideo");

// Segundo exacto del video en el que entran yellow.png y ruby.png
const TEXT_TRIGGER_TIME = 0.5; 

let started = false;
let textShown = false;

function startSequence() {
    if (started) return;
    started = true;

    intro.classList.add("active");
    video.play().catch(() => {});
}

// Sincronizar la entrada del texto PNG con el avance del video
video.addEventListener("timeupdate", () => {
    if (!textShown && video.currentTime >= TEXT_TRIGGER_TIME) {
        intro.classList.add("show-text");
        textShown = true;
    }
});

// Cuando termina el video (o a los 5 segundos si el video es más corto), pasamos a loading.html
const finishIntro = () => {
    intro.classList.add("fadeOut");
    setTimeout(() => {
        window.location.href = "loading.html";
    }, 1000);
};

// Puedes hacer que cambie justo al terminar el video:
video.addEventListener("ended", () => {
    setTimeout(finishIntro, 800); // Espera 0.8s extra tras terminar el video para apreciar el logo completo
});

// Arrancar todo sincronizado con el audio
window.addEventListener("DOMContentLoaded", () => {
    sound.volume = 0.6;
    sound.addEventListener("playing", startSequence, { once: true });

    sound.play().catch(() => {
        // Respaldo si el navegador bloquea autoplay con audio
        startSequence();
        // Si el video no disparara textShown por algún motivo, respaldo de seguridad:
        setTimeout(() => intro.classList.add("show-text"), TEXT_TRIGGER_TIME * 1000);
    });
});
</script>

</body>
</html>
