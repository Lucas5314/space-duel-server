<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skin</title>

<link rel="stylesheet" href="style/paginaskin.css">

</head>

<body>

<div id="stars"></div>

<div class="skinPage">

    <!-- Botón volver -->

    <button id="backBtn">
        ← VOLVER
    </button>


    <!-- Rareza -->

    <div id="rarity" class="rarity">

        ⭐ COMÚN

    </div>


    <!-- Nave -->

    <div class="shipContainer">

        <img
            id="skinImage"
            src="assets/ships/naveee1.png"
            alt="Skin">

    </div>


    <!-- Nombre -->

    <h1 id="skinName">

        TRUE YELLOW DIAMOND

    </h1>


    <!-- Descripción -->

    <p id="skinDescription">

        Una nave creada para explorar el universo
        y enfrentar cualquier desafío espacial.

    </p>


    <!-- Información -->

    <div class="skinInfo">

        <div class="infoBox">

            <span>Rareza</span>

            <strong id="skinRarity">

                Común

            </strong>

        </div>


        <div class="infoBox">

            <span>Estado</span>

            <strong id="skinState">

                Desbloqueada

            </strong>

        </div>

    </div>


    <!-- Botón -->

    <button id="equipBtn">

        EQUIPAR

    </button>

</div>

<script src="js/paginaskin.js"></script>

</body>

</html>
