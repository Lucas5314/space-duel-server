<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Skin</title>

<link rel="stylesheet" href="style/paginaskin.css">

</head>

<body>

    <!-- Imagen de la interfaz -->
    <img
        id="ui"
        src="assets/backgrounds/hangar.png"
        alt="Interfaz">

    <!-- Botón volver -->
    <img
        id="backBtn"
        src="assets/ui/back.png"
        alt="Volver">

    <!-- Panel izquierdo -->

    <div id="infoPanel">

    </div>

    <!-- Personaje -->

    <div id="viewer">

        <video
            id="characterVideo"
            autoplay
            loop
            muted
            playsinline>

            <source
                src="assets/skins/yellow.webm"
                type="video/webm">

        </video>

    </div>

    <!-- Botón equipar -->

    <img
        id="equipBtn"
        src="assets/ui/equipar.png"
        alt="Equipar">

    <script src="js/paginaskin.js"></script>

</body>

</html>
