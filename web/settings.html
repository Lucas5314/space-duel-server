<!DOCTYPE html>

<html lang="es">

<head>

```
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPACE TIP - Configuración</title>

<link rel="stylesheet" href="style/settings.css">
```

</head>

<body>

```
<!-- =========================
     FONDO PERSONALIZADO
========================== -->

<div id="background"></div>


<!-- =========================
     PANEL DE CONFIGURACIÓN
========================== -->

<div class="panel">


    <!-- TÍTULO PERSONALIZADO -->

    <h1 class="settingsTitle">

        <img
            src="assets/ui/settings.png"
            alt="Configuración">

    </h1>


    <!-- =========================
         MÚSICA
    ========================== -->

    <div class="option">

        <span>🔊 Música</span>

        <label class="switch">

            <input
                type="checkbox"
                id="music">

            <span class="slider"></span>

        </label>

    </div>


    <!-- DIVISOR -->

    <div class="divider">

        <img
            src="assets/ui/divider.png"
            alt="">

    </div>


    <!-- =========================
         SONIDOS
    ========================== -->

    <div class="option">

        <span>🔫 Sonidos</span>

        <label class="switch">

            <input
                type="checkbox"
                id="sound">

            <span class="slider"></span>

        </label>

    </div>


    <!-- DIVISOR -->

    <div class="divider">

        <img
            src="assets/ui/divider.png"
            alt="">

    </div>


    <!-- =========================
         VIBRACIÓN
    ========================== -->

    <div class="option">

        <span>📳 Vibración</span>

        <label class="switch">

            <input
                type="checkbox"
                id="vibration">

            <span class="slider"></span>

        </label>

    </div>


    <!-- DIVISOR -->

    <div class="divider">

        <img
            src="assets/ui/divider.png"
            alt="">

    </div>


    <!-- =========================
         CALIDAD GRÁFICA
    ========================== -->

    <div class="option">

        <span>🎮 Calidad gráfica</span>

        <select id="quality">

            <option value="low">Baja</option>

            <option value="medium">Media</option>

            <option value="high">Alta</option>

        </select>

    </div>


    <!-- =========================
         VERSIÓN
    ========================== -->

    <div class="version">

        SPACE TIP v1.0

    </div>


    <!-- =========================
         BOTÓN VOLVER
    ========================== -->

    <button
        id="back"
        aria-label="Volver">

        <img
            src="assets/ui/voltar.png"
            alt="Volver">

    </button>


</div>


<!-- JAVASCRIPT -->

<script src="js/settings.js"></script>
```

</body>

</html>
