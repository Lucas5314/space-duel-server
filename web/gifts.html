<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Recompensa</title>

    <link rel="stylesheet" href="style/gifts.css">

</head>

<body>

    <!-- Fondo -->
    <img
    id="background"
    src="assets/backgrounds/reward.png"
    alt="">


    <div id="overlay"></div>


    <!-- Botón volver -->
    <button
    id="backButton"
    onclick="location.href='menu.html'">

        <img
        src="assets/ui/back-button.png"
        alt="Volver">

    </button>


    <!-- Pantalla -->
    <main id="rewardScreen">


        <!-- Título -->
        <img
        id="rewardTitle"
        src="assets/ui/reward-title.png"
        alt="Recompensa">


        <!-- Cofre -->
        <img
        id="giftChest"
        src="assets/ui/chest.png"
        alt="Cofre">


        <!-- Recompensa -->
        <div id="rewardAnimation">

            <img
            id="coinImage"
            src="assets/ui/coin.png"
            alt="Monedas">

            <h2 id="coinAmount">

                +500

            </h2>

        </div>


        <!-- Botón reclamar -->
        <button id="claimBtn">

            <img
            src="assets/ui/claim-button.png"
            alt="Reclamar">

        </button>


    </main>


    <script src="js/gifts.js"></script>

</body>

</html>
