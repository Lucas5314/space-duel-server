<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangar</title>
  <link rel="stylesheet" href="vestidos.css">
</head>
<body>

  <main class="app" id="game-app">
    
    <section class="preview">
      <div class="turn-controls">
        <button class="turn active" data-view="front">Frente</button>
        <button class="turn" data-view="back">Espalda</button>
      </div>

      <div class="avatar-wrap">
        <img id="avatarSprite" class="avatar" src="assets/ships/naveee1.png" alt="Nave">
      </div>
    </section>

    <section class="wardrobe">
      <nav class="categories" id="categories">
        <button class="cat active" data-category="suits">Naves</button>
        <button class="cat" data-category="auras">Auras</button>
        <button class="cat" data-category="effects">Efectos</button>
      </nav>

      <div class="grid" id="items"></div>

      <div class="footer">
        <button class="save" id="saveBtn">Guardar</button>
      </div>
    </section>

  </main>

  <div class="toast" id="toast">Guardado</div>

  <script type="module" src="vestidos.js"></script>
</body>
</html>
