<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>SPACE TIP - Buscando rival</title>

<link rel="stylesheet" href="style/matchmaking.css">

</head>

<body>

<div id="background"></div>

<div id="overlay"></div>

<div class="container">

    <!-- Portal -->

    <video
        id="portal"
        autoplay
        muted
        loop
        playsinline>

        <source
            src="assets/videos/portal.mp4"
            type="video/mp4">

    </video>

    <!-- Título -->

    <h1>

        BUSCANDO PILOTO

    </h1>

    <!-- Estado de conexión -->

    <div class="connectionStatus">

        <span id="connectionIcon">
            🟢
        </span>

        <span id="connectionText">
            Conectado
        </span>

    </div>

    <!-- Mensaje dinámico -->

    <p id="status">

        Escaneando la galaxia...

    </p>

    <!-- Información del matchmaking -->

    <div class="matchInfo">

        <div class="infoRow">

            <span>🌎</span>

            <span id="region">

                Sudamérica

            </span>

        </div>

        <div class="infoRow">

            <span>👨‍🚀</span>

            <span id="playersOnline">

                0 pilotos conectados

            </span>

        </div>

        <div class="infoRow">

            <span>🎯</span>

            <span id="playersSearching">

                0 buscando combate

            </span>

        </div>

        <div class="infoRow">

            <span>⏱</span>

            <span id="searchTime">

                00:00

            </span>

        </div>

        <div class="infoRow">

            <span>📶</span>

            <span id="ping">

                -- ms

            </span>

        </div>

    </div>

    <!-- Animación de carga -->

    <div class="loading">

        <div class="dot"></div>

        <div class="dot"></div>

        <div class="dot"></div>

    </div>

    <!-- Cancelar búsqueda -->

    <button id="cancel">

        Cancelar

    </button>

</div>

<script src="js/matchmaking.js"></script>

</body>

</html>
