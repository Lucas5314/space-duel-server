<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>SPACE TIP - Eligiendo modo</title>
    <link rel="stylesheet" href="style/matchmaking.css">
</head>
<body>

<div id="background"></div>
<div id="overlay"></div>

<header class="game-header">
    <h1>ELIGIENDO MODO</h1>
</header>

<div class="container">
    <video id="portal" autoplay muted loop playsinline>
        <source src="assets/videos/portal.mp4" type="video/mp4">
    </video>

    <!-- Grilla de 6 mapas en paisaje (3 columnas x 2 filas) -->
    <div class="worldScanner">
        <div class="worldCard"><img src="assets/mapasaelegir/oeste.jpg" alt="Viejo Oeste"></div>
        <div class="worldCard"><img src="assets/mapasaelegir/espacio.jpg" alt="Espacio"></div>
        <div class="worldCard"><img src="assets/mapasaelegir/bosque.jpg" alt="Bosque"></div>
        <div class="worldCard"><img src="assets/mapasaelegir/pirata.jpg" alt="Isla Pirata"></div>
        <div class="worldCard"><img src="assets/mapasaelegir/hielo.jpg" alt="Reino de Hielo"></div>
        <div class="worldCard"><img src="assets/mapasaelegir/volcan.jpg" alt="Volcán"></div>
    </div>
</div>

<script src="js/matchmaking.js"></script>
</body>
</html>
