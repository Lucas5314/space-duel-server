<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elegir mapa</title>

    <link rel="stylesheet" href="style/elegirmapa.css">

</head>

<body>

<div class="contenedorMapas">

    <div class="mapa oeste" data-world="western">
        <img src="assets/mapasaelegir/oeste.jpg" alt="Viejo Oeste">
        <span>VIEJO OESTE</span>
    </div>

    <div class="mapa espacio" data-world="space">
        <img src="assets/mapasaelegir/espacio.jpg" alt="Espacio">
        <span>ESPACIO</span>
    </div>

    <div class="mapa bosque" data-world="jungle">
        <img src="assets/mapasaelegir/bosque.jpg" alt="Bosque Encantado">
        <span>BOSQUE ENCANTADO</span>
    </div>

    <div class="mapa pirata" data-world="pirate">
        <img src="assets/mapasaelegir/pirata.jpg" alt="Isla Pirata">
        <span>ISLA PIRATA</span>
    </div>

    <div class="mapa hielo" data-world="frozen">
        <img src="assets/mapasaelegir/hielo.jpg" alt="Reino de Hielo">
        <span>REINO DE HIELO</span>
    </div>

    <div class="mapa volcan" data-world="volcanic">
        <img src="assets/mapasaelegir/volcan.jpg" alt="Volcán">
        <span>VOLCÁN</span>
    </div>

</div>

<script type="module" src="js/elegirmapa.js"></script>

</body>

</html>
