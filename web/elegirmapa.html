<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elegir mapa</title>

    <link rel="stylesheet" href="style/elegirmapa.css">

</head>

<body>

<div class="contenedorMapas">

    <div class="mapa oeste" data-world="western">
        <img src="assets/mapasaelegir/oeste.png" alt="Viejo Oeste">

        <img
            class="nombreMapa"
            src="assets/mapasaelegir/nombre-oeste.png"
            alt="Viejo Oeste">
    </div>


    <div class="mapa espacio" data-world="space">
        <img src="assets/mapasaelegir/espacio.png" alt="Espacio">

        <img
            class="nombreMapa"
            src="assets/mapasaelegir/nombre-espacio.png"
            alt="Espacio">
    </div>


    <div class="mapa bosque" data-world="jungle">
        <img src="assets/mapasaelegir/bosque.png" alt="Bosque Encantado">

        <img
            class="nombreMapa"
            src="assets/mapasaelegir/nombre-bosque.png"
            alt="Bosque Encantado">
    </div>


    <div class="mapa pirata" data-world="pirate">
        <img src="assets/mapasaelegir/pirata.png" alt="Isla Pirata">

        <img
            class="nombreMapa"
            src="assets/mapasaelegir/nombre-pirata.png"
            alt="Isla Pirata">
    </div>


    <div class="mapa hielo" data-world="frozen">
        <img src="assets/mapasaelegir/hielo.png" alt="Reino de Hielo">

        <img
            class="nombreMapa"
            src="assets/mapasaelegir/nombre-hielo.png"
            alt="Reino de Hielo">
    </div>


    <div class="mapa volcan" data-world="volcanic">
        <img src="assets/mapasaelegir/volcan.png" alt="Volcán">

        <img
            class="nombreMapa"
            src="assets/mapasaelegir/nombre-volcan.png"
            alt="Volcán">
    </div>

</div>


<script type="module" src="js/elegirmapa.js"></script>

</body>

</html>
