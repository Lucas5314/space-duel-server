<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perfil</title>

<link rel="stylesheet" href="style/profile.css">

</head>


<body>


<div id="stars"></div>



<div class="profile">

<!-- Botones sociales -->

<div class="socialButtons">


    <button onclick="location.href='chat.html'">

        💬 CHAT

    </button>


    <button onclick="location.href='ranking.html'">

        🏆 RANKING

    </button>


    <button onclick="location.href='invite.html'">

        👥 INVITAR

    </button>


</div>

    <!-- Información superior -->

    <div class="topBar">


        <div class="playerInfo">


            <div class="playerRow">


                <h2 id="playerName">
                    Ricardo
                </h2>


                <span class="flag">
                    🇵🇾 PY
                </span>


            </div>




            <div class="miniStats">


                <div class="stat statWins">

                    <span>
                        🟢 V
                    </span>

                    <strong id="wins">
                        0
                    </strong>

                </div>




                <div class="stat statLosses">

                    <span>
                        🔴 D
                    </span>

                    <strong id="losses">
                        0
                    </strong>

                </div>




                <div class="stat statStreak">

                    <span>
                        🔥
                    </span>

                    <strong id="streak">
                        0
                    </strong>

                </div>




                <div class="stat statGames">

                    <span>
                        🎮
                    </span>

                    <strong id="games">
                        0
                    </strong>

                </div>


            </div>


        </div>


    </div>






    <!-- Nave -->

    <div class="shipContainer">


        <img
            id="ship"
            src="assets/ships/naveee1.png"
            alt="Perfil">


    </div>







    <!-- Nivel -->


    <div class="level">


        <span>
            ⭐ Nivel 1
        </span>



        <div class="xpBar">


            <div class="xp"></div>


        </div>


    </div>








    <!-- Botones principales -->


    <div class="menuButtons">


        <button id="playBtn">

            ▶ JUGAR

        </button>



        <button id="skinsBtn">

            🚀 SKINS

        </button>



        <button id="settingsBtn">

            ⚙ CONFIGURACIÓN

        </button>


    </div>




</div>





<script src="js/profile.js"></script>


</body>

</html>
