<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil</title>
    

    <link rel="stylesheet" href="style/profile.css">

</head>


<body>
    <button id="coinsBtn">

    <img
        id="coinIcon"
        src="assets/ui/coins.png"
        alt="Monedas">

    <span id="coinsAmount">0</span>

    <img
        id="coinsPlus"
        src="assets/ui/icons/plus.png"
        alt="+">

</button>

    <div id="selectedWorld"></div>

<!-- ========================= -->
<!-- FONDO DEL MUNDO -->
<div id="profileBackground">

    <div class="world active">

    <img src="assets/worlds/fondo.png">

</div>


<div class="profile">

    <!-- TODO EL RESTO DEL HTML AQUÍ -->

</div>
    <!-- ========================= -->
    <!-- COLUMNA IZQUIERDA -->
    <!-- ========================= -->

    <button
        id="settingsBtn"
        onclick="location.href='settings.html'">
    </button>

    <button
        id="chatBtn"
        onclick="location.href='chat.html'">
    </button>

    <button
        id="inviteBtn"
        onclick="location.href='invite.html'">
    </button>

    <button
        id="skinsBtn"
        onclick="location.href='skins.html'">
    </button>

    <button
        id="rankingBtn"
        onclick="location.href='ranking.html'">
    </button>


    <!-- ========================= -->
    <!-- PERFIL -->
    <!-- ========================= -->

    <div class="profileCard">

    <div class="playerInfo">

        <div class="playerRow">

            <h2 id="playerName">
                Ricardo
            </h2>

            <span class="flag">
                🇵🇾 PY
            </span>

        </div>


        <div class="miniStats">

            <div class="stat statWins">

                <span>🟢 V</span>

                <strong id="wins">
                    0
                </strong>

            </div>


            <div class="stat statLosses">

                <span>🔴 D</span>

                <strong id="losses">
                    0
                </strong>

            </div>


            <div class="stat statStreak">

                <span>🔥</span>

                <strong id="streak">
                    0
                </strong>

            </div>


            <div class="stat statGames">

                <span>🎮</span>

                <strong id="games">
                    0
                </strong>

            </div>

        </div>

    </div>

</div>


    <!-- ========================= -->
    <!-- NAVE -->
    <!-- ========================= -->

    <div class="shipContainer">

        <video
            id="shipEnergy"
            autoplay
            loop
            muted
            playsinline>

            <source src="assets/ui/ship-energy.webm" type="video/webm">

        </video>

        <video
            id="shipBase"
            autoplay
            loop
            muted
            playsinline>

            <source src="assets/ui/ship-base.webm" type="video/webm">

        </video>

        <img
            id="ship"
            src="assets/ships/naveee1.png"
            alt="Perfil">

    </div>


    <!-- ========================= -->
    <!-- NIVEL -->
    <!-- ========================= -->

    <div class="level">

        <img
            class="levelIcon"
            src="assets/ui/icons/level.png">

        <span>
            Nivel 1
        </span>

        <div class="xpBar">
            <div class="xp"></div>
        </div>

    </div>


    <!-- ========================= -->
    <!-- PLAY -->
    <!-- ========================= -->

    <div class="menuButtons">
        <button
    id="worldBtn"
    onclick="location.href='elegirmapa.html'">
</button>

        <button id="playBtn"></button>

    </div>

</div>
<!-- =========================
        NEWS POPUP
========================== -->

<div id="newsPopup">

    <div id="popupBackground"></div>

    <div id="popupWindow">

        <img id="popupImage" src="assets/events/news01.png">

        <img id="popupClose" src="assets/ui/close.png">

    </div>

</div>

<script type="module" src="js/profile.js"></script>

</body>

</html>
