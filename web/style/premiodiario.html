<!DOCTYPE html>
<html lang="es">

<head>

    <title>Space Tip - Premio Diario</title>

    <link rel="stylesheet" href="style/premiodiario.css">

</head>


<body>


<div class="container">


    <!-- TÍTULO -->

    <h1>PREMIO DIARIO</h1>

    <p class="subtitulo">

                <div class="candado">
                    🔒

            </div>


        </div>

    </div>


    <!-- VOLVER -->

    <button
        class="volver"
        onclick="location.href='profile.html'"

        ← VOLVER

</div>


<script src="js/premiodiario.js"></script>

</html>
