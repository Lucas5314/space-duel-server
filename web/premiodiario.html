<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Space Tip - Premio Diario</title>

    <link
        rel="stylesheet"
        href="style/premiodiario.css"
    >

</head>


<body>


<div class="container">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="dailyHeader">

        <!-- Fondo del header -->
        <img
            class="headerBackground"
            src="assets/premiodiario/header.png"
            alt=""
        >

        <!-- Título personalizado -->
        <img
            class="headerTitle"
            src="assets/premiodiario/titulo-premio-diario.png"
            alt="Premio Diario"
        >

        <!-- Botón volver -->
        <button
            class="volver"
            onclick="location.href='profile.html'"
        >

            <img
                src="assets/premiodiario/boton-volver.png"
                alt="Volver"
            >

        </button>

    </header>

    ========================== -->

    <main class="recompensas-wrapper">


        <div class="recompensas">

                 DÍA 1
            ====================== -->

            <div
                class="recompensa disponible"
                data-day="1"
            >

                    class="marcoRecompensa"
                    src="assets/premiodiario/marco-recompensa.png"
                    alt=""

                <img
                    class="premioImagen"
