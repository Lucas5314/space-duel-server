<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resultado</title>

<link rel="stylesheet" href="style/result.css">

</head>


<body>


<div id="resultScreen">


    <div class="backgroundGlow"></div>


    <div class="resultContent">


        <h1 id="resultTitle">
            VICTORIA
        </h1>



        <h2 id="player">
            RICARDO
        </h2>



        <div class="cards">


            <div class="card">
                <span>⭐</span>
                <h3>+25</h3>
                <p>PUNTOS</p>
            </div>



            <div class="card">
                <span>🚀</span>
                <h3>RANGO ↑</h3>
                <p>CAPITÁN</p>
            </div>



            <div class="card">
                <span>🏆</span>
                <h3>10</h3>
                <p>VICTORIAS</p>
            </div>


        </div>



        <button id="continueBtn">
            CONTINUAR
        </button>



    </div>



</div>



<script src="js/result.js"></script>


</body>

</html>
