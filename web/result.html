<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resultado</title>

<link rel="stylesheet" href="style/result.css">

</head>

<body>

<div class="marco">

    <!-- Marco principal -->
    <img src="img/recuadro.png" class="marco-img" alt="">

    <div class="contenido">

        <div id="resultScreen">

            <div class="backgroundGlow"></div>

            <div class="resultContent">

                <!-- VICTORIA / DERROTA -->
                <img
                    id="resultTitle"
                    class="titleImage"
                    src="assets/result/victory.png"
                    alt="Victoria"
                >

                <!-- Nombre del jugador -->
                <div class="playerBox">

                    <img
                        class="playerFrame"
                        src="assets/result/player_box.png"
                        alt=""
                    >

                    <span id="playerName">
                        RICARDO
                    </span>

                </div>

                <!-- Rango -->
                <div class="rankBox">

                    <img
                        id="rankImage"
                        src="assets/ranks/captain.png"
                        alt="Captain"
                    >

                </div>

                <!-- Recompensas -->
                <div class="rewards">

                    <!-- Puntos -->
                    <div class="reward">

                        <img
                            src="assets/result/reward_points.png"
                            alt=""
                        >

                        <span id="pointsValue">
                            +25
                        </span>

                    </div>

                    <!-- Victorias -->
                    <div class="reward">

                        <img
                            src="assets/result/reward_wins.png"
                            alt=""
                        >

                        <span id="winsValue">
                            10
                        </span>

                    </div>

                    <!-- Monedas -->
                    <div class="reward">

                        <img
                            src="assets/result/reward_coins.png"
                            alt=""
                        >

                        <span id="coinsValue">
                            +50
                        </span>

                    </div>

                </div>

                <!-- Botón Continuar -->
                <img
                    id="continueBtn"
                    class="continueButton"
                    src="assets/result/continue.png"
                    alt="Continuar"
                >

            </div>

        </div>

    </div>

</div>

<script src="js/result.js"></script>

</body>
</html>
