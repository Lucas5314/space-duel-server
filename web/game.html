<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>SPACE TIP</title>

<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  width:100%;
  height:100%;
  background:transparent;
  font-family:sans-serif;
  touch-action:none;
}
#shoot{

  position:fixed;

  bottom:30px;

  right:30px;

  width:95px;

  height:95px;

  border-radius:50%;

  border:none;

  background:#ff3b3b;

  color:white;

  font-size:40px;

  z-index:999;

}
/* CELULAR */
@media (max-width: 768px){

    #shoot{
        display:none;
    }

}

canvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  display:block;
  background: transparent;
}

#status{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  background:rgba(0,0,0,0.45);
  padding:10px 18px;
  border-radius:16px;
  z-index:999;
  text-align:center;
}

#countdown{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    z-index:10000;

    display:none;

    align-items:center;
    justify-content:center;

}

#result{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:rgba(0,0,0,0.92);
  color:white;
  z-index:9999;
  font-size:46px;
}

.sticker-panel {

    position: fixed;

    bottom: 20px;

    left: 50%;

    transform: translateX(-50%);

    display: flex;

    gap: 10px;

    z-index: 10;

}



.sticker-panel button {

    width: 60px;

    height: 60px;

    background: rgba(0,0,0,0.4);

    border: 2px solid white;

    border-radius: 15px;

    padding: 5px;

    cursor:pointer;

}



.sticker-panel img {

    width:100%;

    height:100%;

    object-fit:contain;

}
#invisible{

  position:fixed;

  bottom:30px;

  left:30px;

  width:95px;

  height:95px;

  border-radius:50%;

  border:none;

  background:#7b3cff;

  color:white;

  font-size:34px;

  z-index:999;

}
#gameBackground{
  position:fixed;

  top:0;
  left:0;

  width:100vw;
  height:100vh;

  object-fit:cover;

  z-index:-1;
}
#explosionVideo{

    position:fixed;

    width:200px;
    height:200px;

    display:none;

    z-index:5;

    object-fit:contain;

}
#joystick{

    position:fixed;

    width:180px;
    height:180px;

    display:none;

    pointer-events:none;

    z-index:500;

    transform:translate(-50%,-50%);
}
#playerCard,
#enemyCard{

    position:fixed;

    display:flex;

    align-items:center;

    gap:10px;

    background:rgba(0,0,0,.45);

    border:2px solid cyan;

    border-radius:15px;

    padding:10px;

    color:white;

    z-index:900;

    backdrop-filter:blur(8px);

}

#playerCard{

    left:15px;

    bottom:15px;

}

#enemyCard{

    right:15px;

    top:15px;

}

#playerCard img,
#enemyCard img{

    width:48px;

    height:48px;

    border-radius:50%;

    border:2px solid white;

}
#matchIntro{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:black;

    z-index:9999;

    display:none;

    flex-direction:column;
    align-items:center;
    justify-content:center;

}


#introLine{

    position:absolute;

    width:120vw;

    height:4px;

    background:white;

    transform:rotate(-25deg) translateX(0);

    box-shadow:
    0 0 15px cyan,
    0 0 30px cyan;

}


#introText{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    z-index:10001;

    display:flex;
    flex-direction:column;
    align-items:center;

    color:white;

    text-shadow:
        0 0 15px cyan,
        0 0 30px black;

}

#introTitle{

    font-size:25px;

}


#introMode{

    font-size:60px;

}


#introObjective{

    margin-top:20px;

    font-size:22px;

}
#mapName{

    position:absolute;

    top:60px;
    left:50%;

    transform:translateX(-50%);

    z-index:10001;

}

#mapImage{

    width:70%;
    max-width:700px;

    border:4px solid cyan;
    border-radius:20px;

    box-shadow:
    0 0 25px cyan;

    margin-bottom:30px;

}
</style>
</head>

<body>


<div id="countdown"></div>


<div id="countdown"></div>
<!-- INTRO PARTIDA -->

<div id="matchIntro">

    <h1 id="mapName">
        CALLEJÓN ASESINO
    </h1>

    <img
        id="mapImage"
        src="assets/ui/callejon.jpeg"
        alt="Callejón Asesino">

    <div id="introLine"></div>

    <div id="introText">

        <span id="introTitle">
            MODO
        </span>

        <strong id="introMode">
            PING PONG
        </strong>

        <span id="introObjective">
            Destruye la nave rival
        </span>

    </div>

</div>

</div>

<div id="result">
  <div id="resultText"></div>
  <button onclick="location.reload()">Jugar otra vez</button>
</div>
<video id="gameBackground" loop muted playsinline>
    <source src="assets/backgrounds/mapa.mp4" type="video/mp4">
</video>
<video
    id="joystick"
    muted
    loop
    playsinline
    preload="auto">

    <source
    src="assets/ui/joystick.mp4"
    type="video/mp4">

</video>
<video id="explosionVideo" muted playsinline>
   <source src="assets/effects/explosion.webm" type="video/webm">
</video>

<canvas id="c"></canvas>

<!-- FICHA JUGADOR -->
<div id="playerCard">

    <img id="playerAvatar"
         src="assets/ui/default-avatar.png">

    <div>

        <div id="playerName">Jugador</div>

        <div id="playerLevel">Lv.1</div>

    </div>

</div>

<!-- FICHA RIVAL -->
<div id="enemyCard">

    <img id="enemyAvatar"
         src="assets/ui/default-avatar.png">

    <div>

        <div id="enemyName">Rival</div>

        <div id="enemyLevel">Lv.1</div>

    </div>

</div>

<button id="shoot">🔥</button>
<button id="invisible">👻</button>


<!-- STICKERS -->

<div class="sticker-panel">


    <button>
        <img src="assets/stickers/fuego.jpg">
    </button>


    <button>
        <img src="assets/stickers/gg.jpg">
    </button>


    <button>
        <img src="assets/stickers/corona.jpg">
    </button>


</div>



<div id="stickerEffect"></div>


//<script src="js/worlds.js"></script>//

<script src="js/game.js"></script>

<script>
const sounds = {

    shoot: new Audio("assets/sounds/laser.mp3"),

    hit: new Audio("assets/sounds/hit.mp3"),

    engine: new Audio("assets/sounds/engine.mp3"),

    explosion: new Audio("assets/sounds/explosion.mp3")

};


sounds.engine.loop = true;
sounds.engine.volume = 0.25;

let currentWorld = "space";
console.log("Mundo actual:", currentWorld);

console.log("Datos del mundo:", worlds[currentWorld]);
// ================= ADMOB (CAPACITOR 8 FIX REAL) =================

let matchCount = 0;
let AdMobReady = false;

async function initAdMob(){

  console.log("=== INIT ADMOB ===");

  try{

    if(!window.Capacitor?.Plugins){

      console.log("Capacitor Plugins NO encontrados");
      return;

    }

    console.log("Capacitor encontrado");

    const { AdMob } = window.Capacitor.Plugins;

    console.log("Inicializando AdMob...");

    await AdMob.initialize({
      requestTrackingAuthorization: true,
      initializeForTesting: false
    });

    AdMobReady = true;

    console.log("AdMob listo");

  }catch(e){

    console.log("Error inicializando AdMob:", e);

  }

}

document.addEventListener("DOMContentLoaded", initAdMob);

async function showInterstitialAd(){

  console.log("=== showInterstitialAd() ===");

  if(!AdMobReady){

    console.log("AdMobReady = FALSE");
    return;

  }

  console.log("AdMobReady = TRUE");

  try{

    const { AdMob } = window.Capacitor.Plugins;

    console.log("Preparando anuncio...");

    await AdMob.prepareInterstitial({

      adId: "ca-app-pub-9974496135349488/6520313527"

    });

    console.log("Anuncio preparado");

    console.log("Mostrando anuncio...");

    await AdMob.showInterstitial();

    console.log("Anuncio mostrado");

  }catch(e){

    console.log("ERROR mostrando anuncio:", e);

  }

}

// ================= CONFIG =================

const WORLD_WIDTH = 900;
const WORLD_HEIGHT = 820;

// ================= CANVAS =================

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
  const dpr = window.devicePixelRatio || 1;

  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

resize();
addEventListener("resize", resize);

// ================= UI =================

const countdown = document.getElementById("countdown");
const result = document.getElementById("result");
const resultText = document.getElementById("resultText");

// ================= ASSETS =================

const ship = new Image();
ship.src = "assets/ships/naveee1.png";

const portalImage = new Image();

portalImage.src =
"assets/portal.gif";

// BALA

const bulletImage = new Image();
bulletImage.src = "assets/bullets/bullet1.png";


const shootSound = new Audio(
"https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"
);
shootSound.volume = 0.25;

// ================= STATE =================

let myId = null;

const state = {
  players:[],
  projectiles:[],
  portal:null
};

const particles = [];

// ===========================
// INTRO DEL MATCH
// ===========================

function showMatchIntro(){

    console.log("MOSTRANDO INTRO");

    const intro = document.getElementById("matchIntro");

    intro.style.display = "flex";


    setTimeout(()=>{

        intro.style.display = "none";

    },3000);

}

// ================= WS =================
console.log("Creando WebSocket...");
const ws = new WebSocket("wss://space-duel-server-1.onrender.com");

ws.onopen = ()=>{

  console.log("WebSocket conectado");

  const player = JSON.parse(
    localStorage.getItem("player")
  );
  console.log("PLAYER:", player);
console.log("USERNAME:", player?.username);

  ws.send(JSON.stringify({

    type:"play",

    username: player.username

  }));

};
ws.onmessage = e=>{

  const msg = JSON.parse(e.data);

  console.log("Mensaje recibido:", msg.type);


  if(msg.type==="welcome"){

    myId = msg.id;

  }


  if(msg.type==="matchIntro"){

    showMatchIntro();

  }


  if(msg.type==="countdown"){

    countdown.style.opacity = 1;

    countdown.textContent = msg.value;


  }



    if(msg.value==="FIGHT"){

    const bg =
    document.getElementById("gameBackground");

    bg.play();

    setTimeout(()=>{
        countdown.style.opacity=0;
    },700);


  
}

  if(msg.type==="state"){
      
      console.log("STATE RECIBIDO", msg); 
      for(const p of msg.players){
    console.log(p.id, p.invisible);
}

      state.players = msg.players;

      state.projectiles = msg.projectiles;

      state.portal = msg.portal;
  }

  if(msg.type==="hit"){
    createHitEffect(msg.x,msg.y);
}
  if(msg.type==="gameover"){

    console.log("GAME OVER");

    stopBattleMusic();

    matchCount++;

    console.log("Partidas jugadas:", matchCount);


    if(matchCount % 1 === 0){

        console.log("Intentando mostrar anuncio...");

        showInterstitialAd();

    }else{

        console.log("Todavía no corresponde anuncio");

    }


    if(msg.loser === myId){

        localStorage.setItem("matchResult","lose");

    }else{

        localStorage.setItem("matchResult","win");

    }


    // EXPLOSIÓN

    const explosion =
document.getElementById("explosionVideo");

const loser =
state.players.find(
    p => p.id === msg.loser
);

if(loser){

    const x =
    (loser.x / WORLD_WIDTH) * innerWidth;

    const y =
    (loser.id === myId)
    ? innerHeight - 130
    : 130;

    explosion.style.left =
    (x - 100) + "px";

    explosion.style.top =
    (y - 100) + "px";

}

explosion.style.display = "block";

explosion.currentTime = 0;

explosion.play();

setTimeout(()=>{

    location.href = "result.html";

},2000);
}
};
// ================= INPUT =================
// ================= INPUT =================



// ================= TOUCH JOYSTICK =================
// ================= TOUCH CONTROL MOVIL =================

const joystick =
document.getElementById("joystick");

let touchActive = false;
let joystickActive = false;
let lastTap = 0;

let keys = {};


// ================= TOUCH START =================

addEventListener("touchstart",(e)=>{


    // no interferir con botones

    if(
        e.target.id === "shoot" ||
        e.target.id === "invisible"
    ){
        return;
    }


    e.preventDefault();


    const touch = e.touches[0];

    const now = Date.now();



    // DOBLE TOQUE = ACTIVAR JOYSTICK DE DISPARO

    if(now - lastTap < 300){


        joystickActive = true;


        joystick.style.display="block";


        joystick.style.left =
        touch.clientX+"px";


        joystick.style.top =
        touch.clientY+"px";


        joystick.currentTime=0;

        joystick.play();



        touchActive = true;


    }


    lastTap = now;



    // Si NO hay joystick:
    // el toque normal queda para mover nave


    if(!joystickActive){


        if(ws.readyState===1){


            ws.send(JSON.stringify({

                type:"input",

                targetX:
                (touch.clientX / innerWidth)
                * WORLD_WIDTH

            }));

        }

    }



},{passive:false});





// ================= TOUCH MOVE =================


addEventListener("touchmove",(e)=>{


    e.preventDefault();


    const touch=e.touches[0];



    // Si joystick está activo:
    // solo dispara

    if(joystickActive){


        if(ws.readyState===1){


            ws.send(JSON.stringify({

                type:"input",

                fire:true

            }));

        }


        return;

    }



    // Si no hay joystick:
    // mover nave


    if(ws.readyState===1){


        ws.send(JSON.stringify({

            type:"input",

            targetX:
            (touch.clientX / innerWidth)
            * WORLD_WIDTH

        }));

    }



},{passive:false});





// ================= TOUCH END =================


addEventListener("touchend",()=>{


    touchActive=false;


    if(joystickActive){


        joystickActive=false;


        joystick.pause();


        joystick.style.display="none";


    }


});


// ================= TECLADO PC =================


addEventListener("keydown",e=>{

    keys[e.code]=true;

});


addEventListener("keyup",e=>{

    keys[e.code]=false;

});





// enviar movimiento teclado

setInterval(()=>{

    if(ws.readyState!==1)
    return;


    ws.send(JSON.stringify({

        type:"input",

        left:
        keys["ArrowLeft"] ||
        keys["KeyA"],


        right:
        keys["ArrowRight"] ||
        keys["KeyD"]

    }));

},50);
// ================= SHOOT =================

document.getElementById("shoot").onclick=()=>{

  shootSound.currentTime=0;
  shootSound.play();

  ws.send(JSON.stringify({
    type:"input",
    fire:true
  }));
};
document.getElementById("invisible").onclick = ()=>{

  ws.send(JSON.stringify({

    type:"invisible"

  }));

};

// ================= FX =================

function createHitEffect(x,y){

    const gif = document.createElement("img");

    const effects = [
        "assets/effects/particle1.gif",
        "assets/effects/particle2.gif",
        "assets/effects/particle3.gif"
    ];

    gif.src =
    effects[Math.floor(Math.random()*effects.length)];


    gif.style.position="fixed";

    gif.style.width="90px";
    gif.style.height="90px";

    gif.style.left =
    ((x/WORLD_WIDTH)*innerWidth - 45)+"px";

    gif.style.top =
    ((y/WORLD_HEIGHT)*innerHeight - 45)+"px";


    gif.style.pointerEvents="none";

    gif.style.zIndex="50";


    document.body.appendChild(gif);


    setTimeout(()=>{

        gif.remove();

    },600);

}
// ================= DRAW =================

function draw(){

  ctx.clearRect(0,0,innerWidth,innerHeight);
  // =================
// PORTAL
// =================

if(state.portal && state.portal.active){

    const px =
    (state.portal.x / WORLD_WIDTH) * innerWidth;

    const py =
    (state.portal.y / WORLD_HEIGHT) * innerHeight;


    ctx.save();

    ctx.shadowBlur = 30;
    ctx.shadowColor = "cyan";


    ctx.drawImage(
        portalImage,
        px - 60,
        py - 60,
        120,
        120
    );


    ctx.restore();

}

  // estrellas
  

  const shipSize=Math.min(innerWidth*0.16,110);

  // players
  for(const p of state.players){

    const isMe=p.id===myId;

    const x=(p.x/WORLD_WIDTH)*innerWidth;
    const y=isMe?innerHeight-130:130;

ctx.save();

ctx.shadowBlur = 20;
ctx.shadowColor = isMe ? "cyan" : "orange";

if(!p.invisible){

    ctx.save();

    ctx.translate(x, y);


    // El rival mira hacia abajo
    if(!isMe){

        ctx.rotate(Math.PI);

    }


    ctx.drawImage(

        ship,

        -shipSize/2,
        -shipSize/2,

        shipSize,
        shipSize

    );


    ctx.restore();

}

    ctx.restore();

    ctx.fillStyle="lime";
    ctx.fillRect(x-shipSize/2,y-shipSize/2-16,p.hp*(shipSize/4),8);
  }

  /// bullets
for(const b of state.projectiles){

    const x = (b.x / WORLD_WIDTH) * innerWidth;
    const y = (b.y / WORLD_HEIGHT) * innerHeight;

    ctx.save();

    ctx.shadowBlur = 20;
    ctx.shadowColor = "cyan";

    ctx.drawImage(

        bulletImage,

        x - 10,
        y - 24,

        20,
        48

    );

    ctx.restore();

}
  // particles
  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;

    ctx.fillStyle=`rgba(255,150,0,${p.life/40})`;

    ctx.fillRect(
      (p.x/WORLD_WIDTH)*innerWidth,
      (p.y/WORLD_HEIGHT)*innerHeight,
      4,4
    );

    if(p.life<=0) particles.splice(i,1);
  }

  requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
