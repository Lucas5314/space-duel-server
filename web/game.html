<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,user-scalable=no"
>

<title>SPACE TIP</title>

<link rel="stylesheet" href="style/game.css">

</head>


<body>


<div id="countdown"></div>


<!-- INTRO PARTIDA -->

<div id="matchIntro">

    <h1 id="mapName">
        CALLEJÓN ASESINO
    </h1>

    <img
        id="mapImage"
        src="assets/ui/callejon.jpeg"
        alt="Callejón Asesino"
    >

    <div id="introLine"></div>

    <div id="introText">

        <span id="introTitle">
            MODO
        </span>

        <strong id="introMode">
            PING PONG
        </strong>

        <span id="introObjective">
            Destruye la nave rival
        </span>

    </div>

</div>


<div id="result">

    <div id="resultText"></div>

    <button onclick="location.reload()">
        Jugar otra vez
    </button>

</div>


<video
    id="joystick"
    muted
    loop
    playsinline
    preload="auto"
>

    <source
        src="assets/ui/joystick.mp4"
        type="video/mp4"
    >

</video>


<video
    id="explosionVideo"
    muted
    playsinline
>

    <source
        src="assets/effects/explosion.webm"
        type="video/webm"
    >

</video>


<canvas id="c"></canvas>


<!-- FICHA JUGADOR -->

<div id="playerCard">

    <img
        class="cardFrame"
        src="assets/ui/playercard.png"
    >

    <img id="playerAvatar">

    <div id="layerInfo">

        <span id="playerName">
            RICARDO
        </span>

        <span id="playerLevel">
            Lv.15
        </span>

    </div>

</div>


<!-- FICHA RIVAL -->

<div id="enemyCard">

    <img
        id="enemyAvatar"
        src="assets/ui/default-avatar.png"
    >

    <div>

        <div id="enemyName">
            Rival
        </div>

        <div id="enemyLevel">
            Lv.1
        </div>

    </div>

</div>


<button id="shoot">
    🔥
</button>


<button id="invisible">
    👻
</button>


<!-- STICKERS -->

<div class="sticker-panel">


    <button>

        <img
            src="assets/stickers/fuego.jpg"
        >

    </button>


    <button>

        <img
            src="assets/stickers/gg.jpg"
        >

    </button>


    <button>

        <img
            src="assets/stickers/corona.jpg"
        >

    </button>


</div>


<div id="stickerEffect"></div>


<!-- RENDERER -->

<script
    type="module"
    src="js/renderer.js"
></script>


<script src="js/game.js"></script>


<script>


// =====================================================
// SONIDOS
// =====================================================

const sounds = {

    shoot: new Audio(
        "assets/sounds/laser.mp3"
    ),

    hit: new Audio(
        "assets/sounds/hit.mp3"
    ),

    engine: new Audio(
        "assets/sounds/engine.mp3"
    ),

    explosion: new Audio(
        "assets/sounds/explosion.mp3"
    )

};


sounds.engine.loop = true;

sounds.engine.volume = 0.25;


// =====================================================
// CONFIG
// =====================================================

const WORLD_WIDTH = 900;

const WORLD_HEIGHT = 820;


// =====================================================
// CANVAS
// =====================================================

const canvas =
    document.getElementById("c");

const ctx =
    canvas.getContext("2d");


function resize(){

    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        innerWidth * dpr;

    canvas.height =
        innerHeight * dpr;


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


resize();


addEventListener(
    "resize",
    resize
);


// =====================================================
// UI
// =====================================================

const countdown =
    document.getElementById("countdown");


const result =
    document.getElementById("result");


const resultText =
    document.getElementById("resultText");


// =====================================================
// WEBSOCKET
// =====================================================

console.log(
    "Creando WebSocket..."
);


const ws =
    new WebSocket(
        "wss://space-duel-server-1.onrender.com"
    );


ws.onopen = ()=>{

    console.log(
        "WebSocket conectado"
    );


    // ==========================================
    // OBTENER JUGADOR
    // ==========================================

    const playerData =
        localStorage.getItem("player");


    console.log(
        "PLAYER DATA:",
        playerData
    );


    // Si no existe jugador,
    // no dejamos que el juego se rompa.

    if(!playerData){

        console.error(
            "❌ No existe el jugador en localStorage"
        );

        location.href =
            "createplayer.html";

        return;

    }


    let player;


    try{

        player =
            JSON.parse(playerData);

    }catch(error){

        console.error(
            "❌ Error leyendo player:",
            error
        );

        localStorage.removeItem(
            "player"
        );

        location.href =
            "createplayer.html";

        return;

    }


    console.log(
        "PLAYER:",
        player
    );


    console.log(
        "USERNAME:",
        player?.username
    );


    // ==========================================
    // VALIDAR USERNAME
    // ==========================================

    if(!player?.username){

        console.error(
            "❌ El jugador no tiene username"
        );

        location.href =
            "createplayer.html";

        return;

    }


    // ==========================================
    // ENVIAR AL SERVIDOR
    // ==========================================

    ws.send(
        JSON.stringify({

            type: "play",

            username: player.username

        })
    );

};


ws.onmessage = e=>{

    const msg =
        JSON.parse(e.data);


    console.log(
        "Mensaje recibido:",
        msg.type
    );


    // ==========================================
    // WELCOME
    // ==========================================

    if(msg.type === "welcome"){

        myId = msg.id;

    }


    // ==========================================
    // MATCH INTRO
    // ==========================================

    if(msg.type === "matchIntro"){

        showMatchIntro();

    }


    // ==========================================
    // COUNTDOWN
    // ==========================================

    if(msg.type === "countdown"){

        const file =
            msg.value === "FIGHT"
                ? "fight"
                : msg.value;


        countdown.innerHTML = `

            <img
                src="assets/ui/countdown/${file}.png"
                class="countdownImage"
            >

        `;


        countdown.style.opacity = 1;


        // Solo intentar reproducir
        // si realmente existe.

        if(msg.value === "FIGHT"){

            const bg =
                document.getElementById(
                    "gameBackground"
                );


            if(bg){

                bg.play().catch(()=>{});

            }

        }


        setTimeout(()=>{

            countdown.style.opacity = 0;

        },700);

    }


    // ==========================================
    // STATE
    // ==========================================

    if(msg.type === "state"){

        console.log(
            "STATE RECIBIDO",
            msg
        );


        for(
            const p of msg.players
        ){

            console.log(
                p.id,
                p.invisible
            );

        }


        state.players =
            msg.players;


        state.projectiles =
            msg.projectiles;


        state.portal =
            msg.portal;

    }


    // ==========================================
    // HIT
    // ==========================================

    if(msg.type === "hit"){

        createHitEffect(
            msg.x,
            msg.y
        );

    }


    // ==========================================
    // GAME OVER
    // ==========================================

    if(msg.type === "gameover"){

        console.log(
            "GAME OVER"
        );


        stopBattleMusic();


        matchCount++;


        console.log(
            "Partidas jugadas:",
            matchCount
        );


        if(matchCount % 1 === 0){

            console.log(
                "Intentando mostrar anuncio..."
            );


            showInterstitialAd();

        }else{

            console.log(
                "Todavía no corresponde anuncio"
            );

        }


        if(msg.loser === myId){

            localStorage.setItem(
                "matchResult",
                "lose"
            );

        }else{

            localStorage.setItem(
                "matchResult",
                "win"
            );

        }

    }

};


// =====================================================
// TOUCH JOYSTICK
// =====================================================

const joystick =
    document.getElementById(
        "joystick"
    );


let touchActive = false;

let joystickActive = false;

let lastTap = 0;

let keys = {};


// =====================================================
// SHOOT
// =====================================================

document.getElementById(
    "shoot"
).onclick = ()=>{


    // ==========================================
    // SONIDO
    // ==========================================

    sounds.shoot.currentTime = 0;


    sounds.shoot
        .play()
        .catch(()=>{});


    // ==========================================
    // DISPARAR
    // ==========================================

    ws.send(
        JSON.stringify({

            type: "input",

            fire: true

        })
    );

};


// =====================================================
// INVISIBLE
// =====================================================

document.getElementById(
    "invisible"
).onclick = ()=>{

    ws.send(
        JSON.stringify({

            type: "invisible"

        })
    );

};


</script>


</body>

</html>
