<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario - Spacetips</title>
    <link rel="stylesheet" href="style/createplayer.css">
</head>

<body>

    <!-- Ya no necesitamos el div de fondo aquí -->

    <div class="container">

        <img src="assets/ui/bienvenido.png" alt="Bienvenido">

        <!-- SOLO NOMBRE DE USUARIO -->
        <div class="group">
            <label>Nombre de Usuario</label>
            <input
                id="name"
                type="text"
                maxlength="16"
                placeholder="Escribe tu apodo"
                autocomplete="off"
            >
        </div>

        <div id="nameError"></div>

        <!-- BOTÓN DE GOOGLE SIGN-IN -->
        <button id="googleLoginBtn" class="google-btn">
            <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google Logo" />
            <span>Crear cuenta con Google</span>
        </button>

    </div>

    <!-- Script con tipo módulo para Capacitor -->
    <script type="module" src="js/createplayer.js"></script>

</body>

</html>
