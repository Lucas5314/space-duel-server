<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPACE TIP - Configuración</title>

<link rel="stylesheet" href="style/settings.css">

</head>

<body>

<div id="stars"></div>

<div class="panel">

    <h1>⚙ CONFIGURACIÓN</h1>

    <div class="option">

        <span>🔊 Música</span>

        <label class="switch">
            <input type="checkbox" id="music">
            <span class="slider"></span>
        </label>

    </div>

    <div class="option">

        <span>🔫 Sonidos</span>

        <label class="switch">
            <input type="checkbox" id="sound">
            <span class="slider"></span>
        </label>

    </div>

    <div class="option">

        <span>📳 Vibración</span>

        <label class="switch">
            <input type="checkbox" id="vibration">
            <span class="slider"></span>
        </label>

    </div>

    <div class="option">

        <span>🎮 Calidad gráfica</span>

        <select id="quality">

            <option value="low">Baja</option>
            <option value="medium">Media</option>
            <option value="high">Alta</option>

        </select>

    </div>

    <div class="version">

        SPACE TIP v1.0

    </div>

    <button id="back">

        ⬅ Volver

    </button>

</div>

<script src="js/settings.js"></script>

</body>

</html>
